<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>家トレ記録</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
header{background:#fff;position:sticky;top:0;z-index:5;padding:16px 16px 12px;border-bottom:1px solid #e5e7eb}
h1{font-size:22px;margin:0 0 4px}
.date{color:#666;font-size:14px}
main{max-width:650px;margin:auto;padding:14px 14px 90px}
.card{background:#fff;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 1px 4px #00000010}
.card h2{font-size:17px;margin:0 0 12px}
.row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px}
input{width:100%;border:1px solid #d7dbe0;border-radius:10px;padding:11px;font-size:16px;background:#fff}
input:focus{outline:2px solid #9bbcff;border-color:#7da5ff}
button{border:0;border-radius:10px;padding:11px 14px;font-size:15px;background:#202124;color:#fff}
.add{width:100%;background:#eef2ff;color:#2445a3;margin-top:4px}
.delete{background:#f1f1f1;color:#666;padding:10px 12px}
.save{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:10}
.save button{width:100%;background:#111827;font-size:17px}
nav{display:flex;gap:8px;margin-bottom:14px}
nav button{flex:1;background:#fff;color:#333;border:1px solid #ddd}
nav button.active{background:#202124;color:#fff}
.hidden{display:none}
.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calendar-head button{background:#eee;color:#333;padding:8px 12px}
.month{font-weight:700}
.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week div{text-align:center;font-size:12px;color:#777;padding:5px}
.day{min-height:52px;background:#fafafa;border-radius:9px;padding:5px;text-align:center;font-size:13px;cursor:pointer}
.day.empty{background:transparent;cursor:default}
.day.has{background:#e8eefc;font-weight:700}
.day.selected{outline:2px solid #222}
.day small{display:block;color:#52657f;margin-top:4px}
.summary{font-size:14px;color:#555;margin-top:8px}
.emptymsg{text-align:center;color:#777;padding:35px 10px}
.toast{position:fixed;left:50%;bottom:75px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:999px;display:none;z-index:20}
</style>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style id="magic-style">body{background:radial-gradient(circle at 50% -10%,#513d63,#17111f 42%,#09070d);color:#f7efd9;font-family:Georgia,"Times New Roman","Hiragino Mincho ProN",serif}header,.card,.panel,.section{background:linear-gradient(145deg,#2b2033,#17111f)!important;border-color:#806b3e!important;box-shadow:0 8px 30px #0008}button,.btn{background:#2b2033!important;color:#f1d993!important;border-color:#806b3e!important}h1,h2,h3{color:#f1d993!important}.magic-fx{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}.spark{position:absolute;color:#f1d993;font-size:22px;animation:spell 1.1s ease-out forwards}@keyframes spell{0%{opacity:0;transform:translate(0,0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.3)}}.magic-title{text-align:center;color:#f1d993;font-family:Georgia,serif;letter-spacing:2px;font-size:12px;margin:-5px 0 10px}.wand{animation:wand 1.5s infinite alternate}@keyframes wand{to{filter:drop-shadow(0 0 9px #f1d993)}} </style></head>
<body>
<header>
  <h1>家トレ記録</h1>
  <div class="date" id="todayLabel"></div>
</header>

<main>
  <nav>
    <button id="tabWorkout" class="active" onclick="showTab('workout')">今日の記録</button>
    <button id="tabCalendar" onclick="showTab('calendar')">カレンダー</button>
  </nav>

  <section id="workout"></section>
  <section id="calendar" class="hidden">
    <div class="card">
      <div class="calendar-head">
        <button onclick="changeMonth(-1)">‹</button>
        <div class="month" id="monthLabel"></div>
        <button onclick="changeMonth(1)">›</button>
      </div>
      <div class="week">
        <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
      </div>
      <div class="days" id="days"></div>
    </div>
    <div id="selectedDay"></div>
  </section>
</main>

<div class="save" id="saveBar"><button onclick="saveToday()">今日の記録を保存</button></div>
<div class="toast" id="toast"></div>

<script>
const exercises = [
  {id:"pushup",name:"腕立て",body:true},
  {id:"situp",name:"腹筋",body:true},
  {id:"shoulder",name:"ショルダープレス"},
  {id:"lateral",name:"サイドレイズ"},
  {id:"curl",name:"アームカール"},
  {id:"french",name:"フレンチプレス"}
];

const KEY="homeWorkoutRecords_v1";
let records=JSON.parse(localStorage.getItem(KEY)||"{}");
let currentDate=new Date();
let calendarDate=new Date();
let editingDate=localDate(new Date());

function localDate(d){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function displayDate(s){
  const d=new Date(s+"T00:00:00");
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

function renderWorkout(date=editingDate){
  editingDate=date;
  const data=records[date]||{};
  document.getElementById("todayLabel").textContent=displayDate(date);
  let html="";
  exercises.forEach(ex=>{
    const sets=data[ex.id]||[];
    html+=`<div class="card"><h2>${ex.name}</h2><div id="sets-${ex.id}">`;
    if(sets.length){
      sets.forEach((s,i)=>html+=setRow(ex,i,s));
    } else {
      html+=setRow(ex,0,{weight:ex.body?"":"",reps:""});
    }
    html+=`</div><button class="add" onclick="addSet('${ex.id}')">＋ セットを追加</button></div>`;
  });
  document.getElementById("workout").innerHTML=html;
}
function setRow(ex,i,s){
  const placeholder=ex.body?"自重":"kg";
  return `<div class="row" data-ex="${ex.id}" data-index="${i}">
    <input class="weight" type="number" step="0.1" inputmode="decimal" placeholder="${placeholder}" value="${esc(s.weight)}">
    <input class="reps" type="number" min="0" step="1" inputmode="numeric" placeholder="回数" value="${esc(s.reps)}">
    <button class="delete" onclick="removeSet('${ex.id}',${i})">削除</button>
  </div>`;
}
function addSet(id){
  const box=document.getElementById("sets-"+id);
  const ex=exercises.find(x=>x.id===id);
  const i=box.querySelectorAll(".row").length;
  box.insertAdjacentHTML("beforeend",setRow(ex,i,{weight:ex.body?"":"",reps:""}));
}
function removeSet(id,i){
  const box=document.getElementById("sets-"+id);
  const rows=box.querySelectorAll(".row");
  if(rows.length<=1){rows[0].querySelector(".weight").value="";rows[0].querySelector(".reps").value="";return;}
  rows[i].remove();
  [...box.querySelectorAll(".row")].forEach((r,n)=>r.dataset.index=n);
}
function collect(){
  const data={};
  exercises.forEach(ex=>{
    const rows=document.querySelectorAll(`#sets-${ex.id} .row`);
    data[ex.id]=[...rows].map(r=>({
      weight:r.querySelector(".weight").value,
      reps:r.querySelector(".reps").value
    })).filter(s=>s.weight!==""||s.reps!=="");
  });
  return data;
}
function saveToday(){
  const data=collect();
  if(!Object.values(data).some(a=>a.length)){delete records[editingDate];}
  else records[editingDate]=data;
  localStorage.setItem(KEY,JSON.stringify(records));
  toast("保存しました");
  renderCalendar();
}
function toast(msg){
  const t=document.getElementById("toast");t.textContent=msg;t.style.display="block";
  setTimeout(()=>t.style.display="none",1400);
}
function showTab(tab){
  document.getElementById("workout").classList.toggle("hidden",tab!=="workout");
  document.getElementById("calendar").classList.toggle("hidden",tab!=="calendar");
  document.getElementById("tabWorkout").classList.toggle("active",tab==="workout");
  document.getElementById("tabCalendar").classList.toggle("active",tab==="calendar");
  document.getElementById("saveBar").style.display=tab==="workout"?"block":"none";
  if(tab==="calendar")renderCalendar();
}
function changeMonth(n){calendarDate.setMonth(calendarDate.getMonth()+n);renderCalendar();}
function renderCalendar(){
  const y=calendarDate.getFullYear(),m=calendarDate.getMonth();
  document.getElementById("monthLabel").textContent=`${y}年${m+1}月`;
  const first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();
  let html="";
  for(let i=0;i<first;i++)html+='<div class="day empty"></div>';
  for(let d=1;d<=last;d++){
    const key=localDate(new Date(y,m,d));
    const has=records[key]&&Object.values(records[key]).some(a=>a.length);
    const cls="day"+(has?" has":"")+(key===editingDate?" selected":"");
    html+=`<div class="${cls}" onclick="selectDay('${key}')">${d}${has?"<small>● 記録</small>":""}</div>`;
  }
  document.getElementById("days").innerHTML=html;
  showSelectedDay(editingDate);
}
function selectDay(key){
  editingDate=key;
  renderWorkout(key);
  showSelectedDay(key);
}
function showSelectedDay(key){
  const data=records[key];
  if(!data){
    document.getElementById("selectedDay").innerHTML=`<div class="card"><h2>${displayDate(key)}</h2><div class="emptymsg">この日の記録はありません</div></div>`;
    return;
  }
  let html=`<div class="card"><h2>${displayDate(key)}</h2>`;
  exercises.forEach(ex=>{
    const sets=data[ex.id]||[];
    if(!sets.length)return;
    html+=`<div style="margin:12px 0"><b>${ex.name}</b>`;
    sets.forEach(s=>html+=`<div class="summary">${s.weight?esc(s.weight)+" kg":"自重"} × ${esc(s.reps)}回</div>`);
    html+="</div>";
  });
  html+=`<button style="width:100%;margin-top:6px" onclick="loadDate('${key}')">この日の記録を編集</button></div>`;
  document.getElementById("selectedDay").innerHTML=html;
}
function loadDate(key){renderWorkout(key);showTab("workout");}

renderWorkout(editingDate);
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
}
</script>
<script id="magic-layer">(()=>{const f=document.createElement('div');f.className='magic-fx';document.body.appendChild(f);const title=document.createElement('div');title.className='magic-title';title.textContent='✦  MAGICAL WORKOUT RECORD  ✦';document.body.prepend(title);function fx(){for(let i=0;i<22;i++){const s=document.createElement('span');s.className='spark';s.textContent=['✦','✧','⋆','✨'][Math.floor(Math.random()*4)];s.style.left=(45+Math.random()*10)+'%';s.style.top=(45+Math.random()*10)+'%';s.style.setProperty('--x',(Math.random()*300-150)+'px');s.style.setProperty('--y',(Math.random()*-260-30)+'px');f.appendChild(s);setTimeout(()=>s.remove(),1200)}}document.addEventListener('click',e=>{if(e.target.closest('button'))fx()});})();</script></body>
</html>
